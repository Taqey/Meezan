<div class="admin-card">
  <div class="aclass-inl-1">
    <div>
      <h2 class="aclass-inl-2">شجرة التصنيف</h2>
      <p class="muted aclass-inl-3" >تسلسل هرمي قابل للتحرير بالكامل (حتى 6 مستويات). التعيين اليدوي يغلب التلقائي دائماً.</p>
    </div>
    <div class="aclass-inl-4">
      <button type="button" class="btn btn-outline btn-sm" (click)="tree.refreshAll()">
        <lucide-icon [img]="RefreshIcon" size="13"></lucide-icon> تحديث
      </button>
      <button type="button" class="btn btn-outline btn-sm" (click)="tree.showDeleted = !tree.showDeleted; tree.loadTree()">
        {{ tree.showDeleted ? 'إخفاء المحذوفة' : 'إظهار المحذوفة' }}
      </button>
      <button type="button" class="btn btn-outline btn-sm" (click)="tree.toggleAuto()">
        الأتمتة: {{ tree.autoEnabled ? 'مفعّلة' : 'معطّلة' }}
      </button>
      <button type="button" class="btn btn-primary btn-sm" (click)="tree.runReclassify()" [disabled]="tree.reclassBusy">
        {{ tree.reclassBusy ? 'جارٍ...' : 'إعادة تصنيف غير المحدد' }}
      </button>
    </div>
  </div>

  <div class="aclass-inl-5">
    <button type="button" class="btn" [class.btn-primary]="view==='tree'" [class.btn-outline]="view!=='tree'" (click)="onSelectView('tree')">الشجرة</button>
    <button type="button" class="btn" [class.btn-primary]="view==='review'" [class.btn-outline]="view!=='review'" (click)="onSelectView('review')">
      تحتاج مراجعة
      <span *ngIf="review.reviewBadge>0" __INL_CLS__="aclass-inl-6">{{ review.reviewBadge }}</span>
    </button>
    <button type="button" class="btn" [class.btn-primary]="view==='log'" [class.btn-outline]="view!=='log'" (click)="onSelectView('log')">سجل التغييرات</button>
  </div>

  <!-- View 1: Tree Tab -->
  <app-admin-classification-tree-tab *ngIf="view === 'tree'"></app-admin-classification-tree-tab>

  <!-- View 2: Review Tab -->
  <app-admin-classification-review-tab *ngIf="view === 'review'"></app-admin-classification-review-tab>

  <!-- Node Funds Side/Bottom Panel -->
  <app-admin-classification-funds-panel></app-admin-classification-funds-panel>

  <!-- Modals (Editor, Move, Merge, Delete, BulkMove, Confirm) -->
  <app-admin-classification-modals></app-admin-classification-modals>
</div>
