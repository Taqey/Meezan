<div class="admin-page">
  <div class="admin-heading">
    <div class="admin-heading-content">
      <span class="eyebrow"><lucide-icon [img]="PiggyBankIcon" size="15"></lucide-icon> الصناديق الاستثمارية</span>
      <h1>إدارة الصناديق الاستثمارية</h1>
      <p>سجل المزامنة، تصنيفات الصناديق، التجاوزات اليدوية وسجل التغييرات.</p>
    </div>
  </div>

  <div class="afunds-inl-1">
    <button type="button" class="btn" data-testid="tab-classification" [class.btn-primary]="section === 'classification'" [class.btn-outline]="section !== 'classification'" (click)="onSelectSection('classification')">التصنيف</button>
    <button type="button" class="btn" [class.btn-primary]="section === 'categories'" [class.btn-outline]="section !== 'categories'" (click)="onSelectSection('categories')">التصنيفات</button>
    <button type="button" class="btn" data-testid="tab-funds" [class.btn-primary]="section === 'funds'" [class.btn-outline]="section !== 'funds'" (click)="onSelectSection('funds')">الصناديق</button>
    <button type="button" class="btn" [class.btn-primary]="section === 'sync'" [class.btn-outline]="section !== 'sync'" (click)="onSelectSection('sync')">سجل المزامنة</button>
    <button type="button" class="btn" [class.btn-primary]="section === 'log'" [class.btn-outline]="section !== 'log'" (click)="onSelectSection('log')">سجل التغييرات</button>
  </div>

  <!-- Section 1: Classification Tree -->
  <div *ngIf="section === 'classification'">
    <app-admin-classification></app-admin-classification>
  </div>

  <!-- Section 2: Categories -->
  <app-admin-funds-categories-tab *ngIf="section === 'categories'"></app-admin-funds-categories-tab>

  <!-- Section 3: Funds -->
  <app-admin-funds-table-tab *ngIf="section === 'funds'"></app-admin-funds-table-tab>

  <!-- Section 4: Sync History -->
  <app-admin-funds-sync-tab *ngIf="section === 'sync'"></app-admin-funds-sync-tab>

  <!-- Section 5: Change Log -->
  <app-admin-funds-change-log-tab *ngIf="section === 'log'"></app-admin-funds-change-log-tab>

  <!-- Reusable Modals (Editor, Merge, Confirm) -->
  <app-admin-funds-modals></app-admin-funds-modals>
</div>
