
    <section class="mz-grid cols-3" *ngIf="variant === 'card'" aria-hidden="true">
      <div class="mz-card mz-lcard mz-sk-card"
           [ngClass]="'kind-' + cardType"
           [style.min-height.px]="cardType === 'fund' ? 319 : (cardType === 'entity' ? 205.4 : (cardType === 'index' ? 231 : 249))"
           *ngFor="let n of range; trackBy: trackIdx">
        <!-- STOCK CARD SKELETON -->
        <ng-container *ngIf="cardType === 'stock'">
          <div class="mz-lcard-top">
            <div class="mz-lcard-head">
              <div class="mz-lcard-id">
                <div class="mz-lcard-text">
                  <span class="mz-lcard-sub skel-inl-1" ><span class="sk-line skel-inl-2" ></span></span>
                  <h3 class="mz-lcard-title"><span class="sk-line skel-inl-3" ></span></h3>
                  <span class="sk-line skel-inl-4" ></span>
                </div>
              </div>
              <div class="mz-lcard-badges">
                <span class="mz-badge neutral skel-inl-5" ><span class="sk-line skel-inl-6" ></span></span>
              </div>
            </div>
            <div class="mz-lcard-main">
              <span class="mz-lcard-main-value"><span class="sk-line skel-inl-7" ></span></span>
              <span class="mz-lcard-main-unit"><span class="sk-line skel-inl-8" ></span></span>
            </div>
          </div>
          <div class="mz-lcard-bottom">
            <div class="mz-lcard-ribbon-wrap">
              <div class="mz-lcard-ribbon skel-inl-9" >
                <span class="sk-line skel-inl-10" ></span>
              </div>
            </div>
            <div class="mz-lcard-tags">
              <div class="mz-lcard-tag-row">
                <span class="sk-line skel-inl-11" ></span>
              </div>
            </div>
            <div class="mz-lcard-foot">
              <div class="mz-lcard-foot-start">
                <span class="sk-line skel-inl-12" ></span>
              </div>
              <div class="mz-lcard-foot-end">
                <span class="sk-line skel-inl-13" ></span>
              </div>
            </div>
          </div>
        </ng-container>

        <!-- FUND CARD SKELETON -->
        <ng-container *ngIf="cardType === 'fund'">
          <div class="mz-lcard-top">
            <div class="mz-lcard-head">
              <div class="mz-lcard-id">
                <div class="sk-line skel-inl-14" ></div>
                <div class="mz-lcard-text">
                  <h3 class="mz-lcard-title"><span class="sk-line skel-inl-15" ></span></h3>
                </div>
              </div>
              <div class="mz-lcard-badges skel-inl-16" >
                <span class="sk-line skel-inl-17" ></span>
                <span class="sk-line skel-inl-18" ></span>
              </div>
            </div>
            <div class="mz-lcard-metrics">
              <div class="mz-metric" *ngFor="let m of [0,1,2,3,4,5]">
                <span class="mz-metric-label"><span class="sk-line skel-inl-19" ></span></span>
                <span class="mz-metric-value"><span class="sk-line skel-inl-20" ></span></span>
              </div>
            </div>
          </div>
          <div class="mz-lcard-bottom">
            <div class="mz-lcard-foot">
              <div class="mz-lcard-foot-start"></div>
              <div class="mz-lcard-foot-end">
                <span class="sk-line skel-inl-21" ></span>
              </div>
            </div>
          </div>
        </ng-container>

        <!-- ENTITY CARD SKELETON (SECTORS / INDICES) -->
        <ng-container *ngIf="cardType === 'entity' || cardType === 'index'">
          <div class="mz-lcard-top">
            <div class="mz-lcard-head">
              <div class="mz-lcard-id">
                <span class="sk-line skel-inl-22" ></span>
                <div class="mz-lcard-text">
                  <h3 class="mz-lcard-title"><span class="sk-line skel-inl-23" ></span></h3>
                  <span class="mz-lcard-sub"><span class="sk-line skel-inl-24" ></span></span>
                </div>
              </div>
              <div class="mz-lcard-badges">
                <span class="sk-line skel-inl-25" ></span>
              </div>
            </div>
            <div class="mz-lcard-metrics">
              <div class="mz-metric" *ngFor="let m of [0,1]">
                <span class="mz-metric-label"><span class="sk-line skel-inl-26" ></span></span>
                <span class="mz-metric-value"><span class="sk-line skel-inl-27" ></span></span>
                <span *ngIf="cardType === 'index' && m === 1" class="sk-line skel-inl-28" ></span>
              </div>
            </div>
          </div>
          <div class="mz-lcard-bottom">
            <div class="mz-lcard-foot">
              <div class="mz-lcard-foot-start"></div>
              <div class="mz-lcard-foot-end">
                <span class="sk-line skel-inl-29" ></span>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </section>

    <div class="kpi-grid" *ngIf="variant === 'kpi'" aria-hidden="true">
      <div class="kpi-card" *ngFor="let n of range; trackBy: trackIdx">
        <div class="sk-line sk-text"></div>
        <div class="sk-line sk-price"></div>
      </div>
    </div>

    <ng-container *ngIf="variant === 'stat'">
      <div class="mz-card mz-stat skel-inl-30" *ngFor="let n of range; trackBy: trackIdx"  aria-hidden="true">
        <div class="mz-stat-top">
          <span class="mz-stat-label"><span class="sk-line skel-inl-31" ></span></span>
          <span class="mz-stat-icon"><span class="sk-line skel-inl-32" ></span></span>
        </div>
        <div class="mz-stat-body">
          <span class="mz-stat-value"><span class="sk-line skel-inl-33" ></span></span>
          <span class="mz-stat-chip skel-inl-9" ><span class="sk-line skel-inl-34" ></span></span>
        </div>
      </div>
    </ng-container>

    <!-- DETAILS PAGE SKELETON -->
    <div class="mz" *ngIf="variant === 'details'" aria-hidden="true">
      <div class="sk-line skel-inl-35" ></div>
      <div class="mz-card mz-dheader">
        <div class="mz-dheader-main skel-inl-36" >
          <div class="mz-dheader-code">
            <span class="sk-line skel-inl-37" ></span>
            <span class="sk-line skel-inl-38" ></span>
          </div>
          <div class="mz-dheader-titlerow skel-inl-39" >
            <span class="sk-line skel-inl-40" ></span>
          </div>
          <div class="mz-dheader-tags">
            <span class="sk-line skel-inl-41" ></span>
            <span class="sk-line skel-inl-42" ></span>
          </div>
        </div>
        <div class="mz-dheader-price">
          <span class="sk-line skel-inl-43" ></span>
          <span class="sk-line skel-inl-44" ></span>
          <span class="sk-line skel-inl-25" ></span>
        </div>
      </div>

      <div class="mz-details-two skel-inl-45" >
        <div class="mz-card mz-dsection" *ngFor="let s of [0,1]">
          <div class="mz-dsection-head">
            <div>
              <span class="sk-line skel-inl-46" ></span>
              <span class="sk-line skel-inl-47" ></span>
            </div>
          </div>
          <span class="sk-line skel-inl-48" ></span>
        </div>
      </div>

      <div class="mz-card mz-dsection skel-inl-49" >
        <div class="mz-dsection-head">
          <div>
            <span class="sk-line skel-inl-50" ></span>
            <span class="sk-line skel-inl-51" ></span>
          </div>
        </div>
        <div class="mz-infogrid">
          <div class="mz-indicator" *ngFor="let i of [0,1,2,3,4,5,6,7]">
            <span class="sk-line skel-inl-52" ></span>
            <span class="sk-line skel-inl-53" ></span>
          </div>
        </div>
      </div>
    </div>
